<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tether — A private space for two</title>
<meta name="description" content="An invite-only app for two people. Chat, moods, a shared diary, photos, music, and a relay novel in one private place.">
<meta name="theme-color" content="#111412">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta property="og:title" content="Tether — A private space for two">
<meta property="og:description" content="An invite-only app for two people.">
<meta property="og:type" content="website">
<style>
/* Tether 랜딩 — 자체 완결형 단일 파일. 외부 CDN·스크립트·폰트 없음. */
:root {
  /* SVIL 고대비 다크 — Tether 브랜드(sage) 계열 */
  --bg: #111412;
  --surface: #1a1f1c;
  --surface-2: #232b26;
  --border: #3a443d;
  --border-strong: #6b7a70;
  --text: #eef2ee;
  --text-sub: #c2cec5;
  --accent: #9adbb2;
  --accent-strong: #b6e8c8;
  --accent-deep: #7fbf98;
  --on-accent: #05291a;
  --focus: #ffd479;

  /* 로컬 설치 폰트만 — CDN 금지. 없으면 시스템 산세리프로 폴백. */
  --font-ui: "LINESeedKR", "LINE Seed KR", "Pretendard", "Malgun Gothic", "맑은 고딕",
             system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Consolas", "Cascadia Mono", ui-monospace, "Malgun Gothic", monospace;

  --page: 1120px;
  --r-sm: 8px;
  --r: 16px;
  --r-lg: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 18px;
  line-height: 1.8;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }

.wrap { width: 100%; max-width: var(--page); margin: 0 auto; padding: 0 24px; }
section { padding: 64px 0; }
section + section { border-top: 1px solid var(--border); }
.center { text-align: center; }

h1 { font-size: 44px; line-height: 1.2; letter-spacing: -0.02em; color: var(--accent); }
h2 { font-size: 30px; line-height: 1.35; letter-spacing: -0.01em; }
h3 { font-size: 20px; line-height: 1.5; }
p { color: var(--text-sub); }
.sub { margin-top: 12px; }
.meta { font-size: 14px; color: var(--text-sub); }
code, .mono { font-family: var(--font-mono); }

/* ── 언어 전환 ── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(17, 20, 18, .92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; font-size: 18px; }
.langbar { display: flex; gap: 6px; flex-wrap: wrap; }
.langbar button {
  min-height: 40px; padding: 6px 12px;
  background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 999px;
  font-family: inherit; font-size: 14px; cursor: pointer;
}
.langbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* ── 버튼 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 14px 28px;
  border: 1.5px solid var(--border); border-radius: 999px;
  background: var(--surface-2); color: var(--text);
  font-family: inherit; font-size: 17px; text-decoration: none; cursor: pointer;
}
.btn:hover { border-color: var(--border-strong); }
.btn-primary { background: var(--accent-deep); color: var(--on-accent); border-color: var(--accent-deep); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.link-quiet { color: var(--accent); text-decoration: none; font-size: 16px; }
.link-quiet:hover { text-decoration: underline; }

/* ── 히어로 ── */
.hero { padding: 72px 0 64px; position: relative; overflow: hidden; }
.hero::before {
  content: ''; position: absolute; inset: -25% 15% 45%;
  background: radial-gradient(closest-side, rgba(154, 219, 178, .15), transparent);
  pointer-events: none;
}
.hero-inner { position: relative; text-align: center; }
.hero h1 { margin-top: 10px; }
.tagline { margin-top: 4px; font-size: 22px; color: var(--text); }
.hero p.sub { margin-left: auto; margin-right: auto; max-width: 46ch; }
.cta-group { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

/* ── 기능 카드 ── */
.grid { margin-top: 32px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px;
}
.card svg { color: var(--accent); }
.card h3 { margin-top: 10px; font-size: 18px; }
.card p { margin-top: 4px; font-size: 15px; }
.card--featured { border-left: 3px solid var(--accent); }
.badge {
  display: inline-block; margin-top: 10px; padding: 2px 10px;
  border-radius: var(--r-sm); background: rgba(154, 219, 178, .16);
  color: var(--accent); font-size: 13px;
}

/* ── 기능 상세 ── */
.detail-list { margin-top: 40px; display: flex; flex-direction: column; gap: 48px; }
.detail-tag {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--accent); font-size: 15px; letter-spacing: .04em;
}
.detail-new {
  font-style: normal; padding: 2px 8px; border-radius: var(--r-sm);
  background: rgba(154, 219, 178, .16); font-size: 12px;
}
.detail h3 { margin-top: 8px; font-size: 24px; }
.detail p { margin-top: 10px; }
.detail-points { margin-top: 14px; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.detail-points li { position: relative; padding-left: 18px; font-size: 16px; color: var(--text-sub); }
.detail-points li::before {
  content: ''; position: absolute; left: 0; top: 12px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
}
.shot-frame {
  border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface); padding: 10px; overflow: hidden;
}
.shot-frame[hidden] { display: none; }
.shot { display: block; width: 100%; height: auto; border-radius: var(--r); }

/* ── 스테퍼 ── */
.steps { margin-top: 32px; list-style: none; }
.step { display: grid; grid-template-columns: 48px 1fr; gap: 16px; padding-bottom: 28px; position: relative; }
.step:last-child { padding-bottom: 0; }
.step::before {
  content: ''; position: absolute; left: 23px; top: 48px; bottom: 0;
  width: 2px; background: var(--border);
}
.step:last-child::before { display: none; }
.step-num {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--text-sub);
  border: 2px solid var(--border); font-size: 18px;
  position: relative; z-index: 1;
}
.step--active .step-num { background: var(--accent-deep); color: var(--on-accent); border-color: var(--accent-deep); }
.step-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step p { margin-top: 6px; font-size: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px; border-radius: var(--r-sm);
  background: rgba(154, 219, 178, .16); color: var(--accent); font-size: 13px;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* ── 승인 대기 ── */
.await-card {
  margin-top: 36px; padding: 32px 24px; text-align: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
}
.await-icon {
  width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
  background: rgba(154, 219, 178, .12); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.await-row {
  margin-top: 20px; padding: 12px 16px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.await-row .k { font-size: 15px; color: var(--text-sub); }
.await-note { margin-top: 14px; font-size: 15px; }

/* ── 설치 안내 ── */
.tabs { margin-top: 28px; display: flex; gap: 8px; flex-wrap: wrap; }
.tab {
  flex: 1 1 auto; min-width: 100px; min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 12px; border-radius: var(--r);
  background: var(--surface); border: 2px solid var(--border);
  color: var(--text); font-family: inherit; font-size: 16px; cursor: pointer;
}
.tab[aria-selected="true"] { border-color: var(--accent); background: rgba(154, 219, 178, .1); }
.tab-mark { font-size: 12px; color: var(--accent); }
.tab:not([aria-selected="true"]) .tab-mark { visibility: hidden; }
.guide { margin-top: 22px; }
.guide ol { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.guide li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
.guide .n {
  width: 28px; height: 28px; border-radius: var(--r-sm);
  background: var(--accent-deep); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center; font-size: 15px; margin-top: 2px;
}
.guide li span:last-child { color: var(--text); font-size: 16px; }
.caution {
  margin-top: 18px; padding: 14px 16px;
  background: rgba(154, 219, 178, .08); border-left: 4px solid var(--accent);
  border-radius: var(--r); display: flex; gap: 10px; align-items: flex-start;
  font-size: 16px; color: var(--text);
}
.caution svg { color: var(--accent); flex-shrink: 0; margin-top: 4px; }

/* ── 프라이버시 ── */
.privacy { margin-top: 26px; list-style: none; display: flex; flex-direction: column; gap: 14px; }
.privacy li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; }
.privacy svg { color: var(--accent); margin-top: 6px; }

/* ── 푸터 ── */
footer { padding: 40px 0 56px; border-top: 1px solid var(--border); }
.foot-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.foot-rows .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; font-size: 16px; }
.foot-rows .k { color: var(--text-sub); min-width: 96px; }
.foot-rows a { color: var(--accent); text-decoration: none; }
.foot-rows a:hover { text-decoration: underline; }
footer p { font-size: 15px; }
.ver {
  display: inline-block; margin-left: 8px; padding: 2px 10px;
  border-radius: var(--r-sm); background: var(--surface-2);
  color: var(--text-sub); font-family: var(--font-mono); font-size: 13px;
}

@media (min-width: 768px) {
  section { padding: 88px 0; }
  h1 { font-size: 62px; }
  h2 { font-size: 36px; }
  .tagline { font-size: 26px; }
  .hero { padding: 104px 0 88px; }
  .cta-group { flex-direction: row; justify-content: center; gap: 16px; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { padding: 24px; }
  .detail-list { gap: 72px; }
  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .detail:nth-child(even) .detail-media { order: 2; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 48px; }
  .step { grid-template-columns: 1fr; gap: 12px; padding-bottom: 0; }
  .step::before { left: 48px; right: -24px; top: 23px; bottom: auto; width: auto; height: 2px; }
  .await-card { padding: 48px 40px; }
  .privacy { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

<header class="topbar">
  <div class="wrap">
    <span class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c0-5 1-8 4-11 0 0-6-1-9 3-2.4 3.2-1 8-1 8s-1-4 1-7c1.6-2.4 4-3 4-3s-4 2-5 6c-.7 2.8 0 4 0 4H12z"/></svg>

    </span>
    <nav class="langbar" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="false">EN</button>

<main>
  <section class="hero">
    <div class="wrap hero-inner">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="color: var(--accent)">

        <path d="M12 22c0-4-1-6-3-8 0 0 4-1 6 2 1.6 2.4.6 6 .6 6z" opacity=".55"/>
      </svg>
      <h1>Tether</h1>
      <p class="tagline" data-i18n="hero_tagline"></p>
      <p class="sub" data-i18n="hero_sub"></p>
      <div class="cta-group">
        <a class="btn btn-primary" href="/"><span data-i18n="cta_primary"></span></a>
        <a class="link-quiet" href="/" data-i18n="cta_secondary"></a>
      </div>
    </div>
  </section>

  <section id="what">
    <div class="wrap">
      <div class="center">
        <h2 data-i18n="what_title"></h2>
        <p class="sub" data-i18n="what_sub"></p>
      </div>
      <div class="grid">
        <article class="card">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <h3 data-i18n="f1_t"></h3><p data-i18n="f1_d"></p>
        </article>
        <article class="card">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
          <h3 data-i18n="f2_t"></h3><p data-i18n="f2_d"></p>
        </article>
        <article class="card">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <h3 data-i18n="f3_t"></h3><p data-i18n="f3_d"></p>
        </article>
        <article class="card">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <h3 data-i18n="f4_t"></h3><p data-i18n="f4_d"></p>
        </article>
        <article class="card">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

  <section id="join">

      <ol class="steps">

          <div>

          <div>
            <div class="step-head">
              <h3 data-i18n="s2_t"></h3>
              <span class="chip"><span class="dot"></span><span data-i18n="chip_waiting"></span></span>
            </div>
            <p data-i18n="s2_d"></p>

          <div class="step-num">3</div>
          <div>

const OS_KEYS = {
  ios: ['ios_1', 'ios_2', 'ios_3', 'ios_4', 'ios_c'],
  android: ['and_1', 'and_2', 'and_3', 'and_4', 'and_c'],
  windows: ['win_1', 'win_2', 'win_3', 'win_4', 'win_c'],
  mac: ['mac_1', 'mac_2', 'mac_3', 'mac_4', 'mac_c']
};

const CAUTION_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';

let lang = 'en';
let os = 'ios';

// 누락 키는 en으로 폴백한다
function t(key) {
  const dict = I18N[lang] || I18N.en;
  if (dict[key] !== undefined) return dict[key];
  if (I18N.en[key] !== undefined) return I18N.en[key];
  return key;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function renderGuide() {
  const keys = OS_KEYS[os];
  const items = keys.slice(0, 4).map(function (k, i) {
    return '<li><span class="n">' + (i + 1) + '</span><span>' + escapeHtml(t(k)) + '</span></li>';
  }).join('');
  document.getElementById('guide').innerHTML =
    '<ol>' + items + '</ol>' +
    '<p class="caution">' + CAUTION_ICON + '<span>' + escapeHtml(t(keys[4])) + '</span></p>';
}

function applyI18n() {
  document.documentElement.lang = lang;
  document.title = t('_title');
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
    el.alt = t(el.dataset.i18nAlt);
  });
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  });
  renderGuide();
}

function setLang(next) {
  lang = I18N[next] ? next : 'en';
  try { localStorage.setItem('tether_landing_lang', lang); } catch (e) { /* 저장 불가 환경 무시 */ }
  applyI18n();
}

// 최초 언어: localStorage → navigator.language → en
function initialLang() {
  try {
    const saved = localStorage.getItem('tether_landing_lang');
    if (saved && I18N[saved]) return saved;
  } catch (e) { /* ignore */ }
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.indexOf('ko') === 0) return 'ko';
  if (nav.indexOf('ja') === 0) return 'ja';
  if (nav.indexOf('zh') === 0) return 'zh';
  if (nav.indexOf('vi') === 0) return 'vi';
  return 'en';
}

function detectOs() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  if (/Macintosh|Mac OS X/i.test(ua)) return 'mac';
  return 'windows';
}

document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { setLang(b.dataset.lang); });
});

const tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
tabs.forEach(function (tab) {
  tab.addEventListener('click', function () {
    os = tab.dataset.os;
    tabs.forEach(function (x) { x.setAttribute('aria-selected', String(x.dataset.os === os)); });
    renderGuide();
  });
});

// 스크린샷은 기본이 숨김. 실제로 불러와진 것만 보여준다.
// (파일이 없을 때 호스팅이 index.html을 200으로 돌려줘도 빈 상자가 남지 않는다)
function revealShot(img) {
  if (img.naturalWidth > 0) {
    const frame = img.closest('.shot-frame');
    if (frame) frame.hidden = false;
  }
}
document.querySelectorAll('.shot').forEach(function (img) {
  if (img.complete) revealShot(img);
  else img.addEventListener('load', function () { revealShot(img); });
});

os = detectOs();
tabs.forEach(function (x) { x.setAttribute('aria-selected', String(x.dataset.os === os)); });
lang = initialLang();
applyI18n();
</script>
